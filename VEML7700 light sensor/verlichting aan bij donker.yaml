alias: Verlichting - Aan bij donker tussen 07:00 en 23:30
description: Zet de lampen aan als het donker wordt en laat ze minimaal 15 minuten branden.
triggers:
  - entity_id: sensor.weerstation_licht
    below: 400
    for:
      minutes: 2
    trigger: numeric_state
  - at: "07:00:00"
    trigger: time
  - event: start
    trigger: homeassistant
conditions:
  - condition: time
    after: "07:00:00"
    before: "23:30:00"
  - condition: numeric_state
    entity_id: sensor.weerstation_licht
    below: 400
actions:
  - condition: time
    after: "07:00:00"
    before: "23:30:00"
  - condition: numeric_state
    entity_id: sensor.weerstation_licht
    below: 400
  - target:
      entity_id:
        - switch.keuken_led_sonoff_relay
        - switch.woonkamer_lamp_kachel
        - switch.sonoff_1000af2fcd_1
    action: switch.turn_on
  - delay:
      minutes: 15
  - choose:
      - conditions:
          - condition: numeric_state
            entity_id: sensor.weerstation_licht
            above: 400
        sequence:
          - target:
              entity_id:
                - switch.keuken_led_sonoff_relay
                - switch.woonkamer_lamp_kachel
                - switch.sonoff_1000af2fcd_1
            action: switch.turn_off
    default:
      - wait_for_trigger:
          - entity_id: sensor.weerstation_licht
            above: 400
            for:
              minutes: 2
            trigger: numeric_state
          - at: "23:30:00"
            trigger: time
      - target:
          entity_id:
            - switch.keuken_led_sonoff_relay
            - switch.woonkamer_lamp_kachel
            - switch.sonoff_1000af2fcd_1
        action: switch.turn_off
mode: restart
