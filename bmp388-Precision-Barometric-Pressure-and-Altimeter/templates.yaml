- sensor:

# **************************************************************************
# **Weerstation
# **************************************************************************


    
    - name: "Weerstation luchtdruk trend tekst"
      state: >
        {% set t = states('sensor.weerstation_luchtdruk_verschil_3_uur') | float(0) %}
        {% if t > 1 %}
          stijgend
        {% elif t < -1 %}
          dalend
        {% else %}
          stabiel
        {% endif %}

    - name: "Weerstation luchtdruk waarschuwing"
      state: >
        {% set t1 = states('sensor.weerstation_luchtdruk_verschil_3_uur') | float(0) %}
        {% set t2 = states('sensor.weerstation_luchtdruk_verschil_6_uur') | float(0) %}
        {% if t1 < -4 or t2 < -8 %}
          Kans op onstuimig weer
        {% elif t1 < -2 %}
          Druk daalt
        {% else %}
          Geen bijzonderheden
        {% endif %}

    - name: "Weerstation weerindicatie"
      state: >
        {% set p = states('sensor.weerstation_luchtdruk') | float(0) %}
        {% set t3 = states('sensor.weerstation_luchtdruk_verschil_3_uur') | float(0) %}
        {% set t6 = states('sensor.weerstation_luchtdruk_verschil_6_uur') | float(0) %}
        {% if p > 1020 and t3 > 1 %}
          Waarschijnlijk stabiel en droog
        {% elif p > 1012 and t3 >= 0 %}
          Redelijk stabiel weer
        {% elif p >= 1000 and t3 > -1 %}
          Wisselvallig
        {% elif p < 1000 and t3 < -2 %}
          Kans op regen
        {% elif p < 995 and t3 < -3 and t6 < -5 %}
          Grote kans op onstuimiger weer
        {% else %}
          Onzekere weersituatie
        {% endif %}

      icon: >
        {% set p = states('ssensor.weerstation_luchtdruk') | float(0) %}
        {% set t3 = states('sensor.weerstation_luchtdruk_verschil_3_uur') | float(0) %}
        {% set t6 = states('sensor.weerstation_luchtdruk_verschil_6_uur') | float(0) %}

        {% if p > 1020 and t3 > 1 %}
          mdi:weather-sunny
        {% elif p > 1012 and t3 >= 0 %}
          mdi:weather-partly-cloudy
        {% elif p >= 1000 and t3 > -1 %}
          mdi:weather-cloudy
        {% elif p < 1000 and t3 < -2 %}
          mdi:weather-rainy
        {% elif p < 995 and t3 < -3 and t6 < -5 %}
          mdi:weather-windy
        {% else %}
          mdi:weather-cloudy-alert
        {% endif %}


